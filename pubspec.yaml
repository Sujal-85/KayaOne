name: medinest
description: A production-ready, multilingual medical application for healthcare.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  lottie: ^3.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  dio: ^5.4.3+1
  path_provider: ^2.1.3
  flutter_svg: ^2.0.10+1
  firebase_core: ^4.3.0
  firebase_auth: 6.1.3
  firebase_analytics: ^12.1.0
  connectivity_plus: ^7.0.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  pinput: ^6.0.1
  video_player: ^2.8.1
  file_picker: ^10.3.8
  image_picker: ^1.2.1
  supabase_flutter: ^2.12.0
  image_cropper: ^11.0.0
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.5.0
  firebase_messaging: ^16.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/lottie/loading_animation.json
    - assets/images/products/
    - assets/lang/
    - assets/lottie/welcome.json
    - assets/lottie/booking_calendar.json
    - assets/lottie/gps_navigation.json
    - assets/lottie/security.json
    - assets/lottie/upload.json
    - assets/lottie/done.json
    - assets/video.mp4
    - assets/lottie/robot_hello.json
    - assets/lottie/blood_donor.json
    - assets/images/logo-removebg.png
    - assets/images/med_product_1.png
    - assets/images/med_product_2.png
    - assets/images/med_product_3.png
    - assets/images/med_product_4.png
    - assets/images/med_product_5.png
    - assets/images/med_product_6.png
    - assets/images/promo_banner_blood_test.png
    - assets/images/promo_banner_health_checkup.png
    - assets/images/article_nutrition.png
    - assets/images/article_mental_health.png
    - assets/images/article_sleep.png
    - assets/images/healthkarma_visual.png
    - assets/images/ai_assistant_visual.png
    - assets/images/logo_removebg.png
    - assets/lottie/Face scanning.json
    - assets/lottie/Health.json
